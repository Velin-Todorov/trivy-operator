---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-security-velin-dev-v1alpha1-imagescan
  failurePolicy: Fail
  name: vimagescan-v1alpha1.kb.io
  rules:
  - apiGroups:
    - security.velin.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - imagescans
  sideEffects: None
